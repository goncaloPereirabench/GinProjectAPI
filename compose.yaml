services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD}"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
